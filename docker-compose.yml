services:
  private-server:
    build: .
    container_name: private-server
    restart: unless-stopped
    # Bound to localhost; put a reverse proxy (Caddy, nginx, Traefik) in front for HTTPS.
    ports:
      - "127.0.0.1:${HOST_PORT:-3001}:3001"
    env_file: .env
    environment:
      - PORT=3001
      - NODE_ENV=production
      - UPLOAD_DIR=/app/uploads
      - LOG_DIR=/app/logs
    volumes:
      - ./data/uploads:/app/uploads
      - ./data/db:/app/db
      - ./data/logs:/app/logs
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
